<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/upsed_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPSED</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('upsed-theme-mode') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <style>
      :root, [data-theme="dark"] {
        --vw-bg: #22262f;
        --vw-sidebar: #22262f;
        --vw-outlet: #14161c;
        --vw-card: #1b1e26;
        --vw-card-border: rgba(255, 255, 255, 0.07);
        --vw-skeleton-base: rgba(255, 255, 255, 0.04);
        --vw-skeleton-shimmer: rgba(255, 255, 255, 0.08);
        --vw-skeleton-text: rgba(255, 255, 255, 0.2);
        --vw-accent: #22c55e;
      }
      [data-theme="light"] {
        --vw-bg: #f1f5f9;
        --vw-sidebar: #f1f5f9;
        --vw-outlet: #ffffff;
        --vw-card: #ffffff;
        --vw-card-border: #e2e8f0;
        --vw-skeleton-base: rgba(0, 0, 0, 0.05);
        --vw-skeleton-shimmer: rgba(0, 0, 0, 0.09);
        --vw-skeleton-text: rgba(0, 0, 0, 0.25);
        --vw-accent: #16a34a;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--vw-bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      @keyframes vw-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .vw-shimmer {
        position: relative;
        overflow: hidden;
        background-color: var(--vw-skeleton-base);
      }
      .vw-shimmer::after {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          var(--vw-skeleton-shimmer) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: vw-shimmer 1.8s infinite;
        content: '';
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100vw; overflow: hidden; background: var(--vw-bg); box-sizing: border-box;">
        <!-- Left Sidebar Wireframe -->
        <aside style="width: 240px; flex-shrink: 0; display: flex; flex-direction: column; padding: 20px 16px; border-right: 1px solid var(--vw-card-border); background: var(--vw-sidebar); box-sizing: border-box;">
          <!-- Brand Badge -->
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
            <div style="width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #059669, #22c55e); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
            <div>
              <div style="font-weight: 700; font-size: 13px; letter-spacing: -0.02em; color: var(--vw-skeleton-text);">UPSED</div>
              <div style="font-size: 10px; font-family: monospace; color: var(--vw-skeleton-text); opacity: 0.6;">UPS Native Core</div>
            </div>
          </div>

          <!-- Nav Items Wireframe -->
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div class="vw-shimmer" style="height: 8px; width: 64px; border-radius: 4px; margin-bottom: 4px;"></div>
            <div class="vw-shimmer" style="height: 36px; border-radius: 8px; width: 100%;"></div>
            <div class="vw-shimmer" style="height: 36px; border-radius: 8px; width: 100%;"></div>
            <div class="vw-shimmer" style="height: 8px; width: 48px; border-radius: 4px; margin: 14px 0 4px 0;"></div>
            <div class="vw-shimmer" style="height: 36px; border-radius: 8px; width: 100%;"></div>
            <div class="vw-shimmer" style="height: 36px; border-radius: 8px; width: 100%;"></div>
            <div class="vw-shimmer" style="height: 36px; border-radius: 8px; width: 100%;"></div>
            <div class="vw-shimmer" style="height: 36px; border-radius: 8px; width: 100%;"></div>
          </div>

          <!-- Bottom Stage Badge Wireframe -->
          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <div class="vw-shimmer" style="height: 32px; border-radius: 8px; width: 100%;"></div>
            <div class="vw-shimmer" style="height: 24px; border-radius: 6px; width: 100%;"></div>
          </div>
        </aside>

        <!-- Main Content Area Wireframe -->
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--vw-outlet); box-sizing: border-box;">
          <!-- Top Header Wireframe -->
          <header style="height: 60px; border-bottom: 1px solid var(--vw-card-border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-sizing: border-box;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="vw-shimmer" style="height: 18px; width: 110px; border-radius: 6px;"></div>
              <div class="vw-shimmer" style="height: 24px; width: 85px; border-radius: 9999px;"></div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <div class="vw-shimmer" style="height: 32px; width: 130px; border-radius: 8px;"></div>
              <div class="vw-shimmer" style="height: 32px; width: 32px; border-radius: 8px;"></div>
            </div>
          </header>

          <!-- Dashboard Content Wireframe -->
          <main style="flex: 1; padding: 24px; overflow: hidden; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box;">
            <!-- 4 Metric Cards Grid -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
              <div style="background: var(--vw-card); border: 1px solid var(--vw-card-border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;">
                <div class="vw-shimmer" style="height: 12px; width: 75px; border-radius: 4px;"></div>
                <div class="vw-shimmer" style="height: 26px; width: 100px; border-radius: 6px;"></div>
                <div class="vw-shimmer" style="height: 10px; width: 55px; border-radius: 4px;"></div>
              </div>
              <div style="background: var(--vw-card); border: 1px solid var(--vw-card-border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;">
                <div class="vw-shimmer" style="height: 12px; width: 85px; border-radius: 4px;"></div>
                <div class="vw-shimmer" style="height: 26px; width: 95px; border-radius: 6px;"></div>
                <div class="vw-shimmer" style="height: 10px; width: 65px; border-radius: 4px;"></div>
              </div>
              <div style="background: var(--vw-card); border: 1px solid var(--vw-card-border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;">
                <div class="vw-shimmer" style="height: 12px; width: 65px; border-radius: 4px;"></div>
                <div class="vw-shimmer" style="height: 26px; width: 80px; border-radius: 6px;"></div>
                <div class="vw-shimmer" style="height: 10px; width: 85px; border-radius: 4px;"></div>
              </div>
              <div style="background: var(--vw-card); border: 1px solid var(--vw-card-border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;">
                <div class="vw-shimmer" style="height: 12px; width: 80px; border-radius: 4px;"></div>
                <div class="vw-shimmer" style="height: 26px; width: 90px; border-radius: 6px;"></div>
                <div class="vw-shimmer" style="height: 10px; width: 60px; border-radius: 4px;"></div>
              </div>
            </div>

            <!-- Central Chart Container Wireframe -->
            <div style="flex: 1; min-height: 240px; background: var(--vw-card); border: 1px solid var(--vw-card-border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="vw-shimmer" style="height: 16px; width: 130px; border-radius: 6px;"></div>
                <div class="vw-shimmer" style="height: 24px; width: 110px; border-radius: 6px;"></div>
              </div>
              <div class="vw-shimmer" style="flex: 1; border-radius: 8px; width: 100%;"></div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
