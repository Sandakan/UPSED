name: Build & Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Test Suite
    uses: ./.github/workflows/test.yml

  build-tauri:
    name: Build & Package (${{ matrix.platform }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-latest'
          - platform: 'macos-latest'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: 'upsed-cargo'

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || 'UPSED v__VERSION__' }}
          releaseBody: |
            For the app changelog, see [CHANGELOG.md](CHANGELOG.md).
            For the bridge firmware changelog, see [upsed-bridge/CHANGELOG.md](upsed-bridge/CHANGELOG.md).
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || true }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}

  build-bridge:
    name: Build ESP32-S3 Bridge Firmware
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate UPSED_OTA_SECRET
        run: |
          if [ -z "${{ secrets.UPSED_OTA_SECRET }}" ]; then
            echo "::error::UPSED_OTA_SECRET repository secret is not set! Please configure UPSED_OTA_SECRET in GitHub Settings > Secrets."
            exit 1
          fi
          echo "UPSED_OTA_SECRET=${{ secrets.UPSED_OTA_SECRET }}" > .env

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            upsed-bridge/.pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('upsed-bridge/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Compile ESP32-S3 Firmware
        run: npm run bridge:build

      - name: Prepare Bridge Artifact
        run: cp upsed-bridge/.pio/build/esp32-s3-devkitc-1/firmware.bin upsed-bridge-firmware.bin

      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upsed-bridge-firmware
          path: upsed-bridge-firmware.bin
          if-no-files-found: error

  upload-bridge-asset:
    name: Attach Bridge Firmware to Release
    needs: [build-tauri, build-bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bridge Artifact
        uses: actions/download-artifact@v4
        with:
          name: upsed-bridge-firmware

      - name: Attach upsed-bridge-firmware.bin to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "Attaching upsed-bridge-firmware.bin to release '$TAG'..."
          gh release upload "$TAG" upsed-bridge-firmware.bin --clobber
