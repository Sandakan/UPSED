name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Test Suite
    uses: ./.github/workflows/test.yml

  build-tauri:
    name: Build & Package (${{ matrix.platform }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-latest'
          - platform: 'macos-latest'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: 'upsed-cargo'

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || 'UPSED v__VERSION__' }}
          releaseBody: |
            For the app changelog, see [CHANGELOG.md](CHANGELOG.md).
            For the bridge firmware changelog, see [upsed-bridge/CHANGELOG.md](upsed-bridge/CHANGELOG.md).
          releaseDraft: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.draft) }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}

  build-bridge:
    name: Build ESP32-S3 Bridge Firmware
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate UPSED_OTA_SECRET
        run: |
          if [ -z "${{ secrets.UPSED_OTA_SECRET }}" ]; then
            echo "::error::UPSED_OTA_SECRET repository secret is not set! Please configure UPSED_OTA_SECRET in GitHub Settings > Secrets."
            exit 1
          fi
          echo "UPSED_OTA_SECRET=${{ secrets.UPSED_OTA_SECRET }}" > .env

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            upsed-bridge/.pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('upsed-bridge/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Compile ESP32-S3 Firmware
        run: npm run bridge:build

      - name: Prepare Bridge Artifact
        run: cp upsed-bridge/.pio/build/esp32-s3-devkitc-1/firmware.bin upsed-bridge-firmware.bin

      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upsed-bridge-firmware
          path: upsed-bridge-firmware.bin
          if-no-files-found: error

  upload-bridge-asset:
    name: Attach Bridge Firmware to Release
    needs: [build-tauri, build-bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bridge Artifact
        uses: actions/download-artifact@v4
        with:
          name: upsed-bridge-firmware

      - name: Attach upsed-bridge-firmware.bin to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "Attaching upsed-bridge-firmware.bin to release '$TAG'..."
          gh release upload "$TAG" upsed-bridge-firmware.bin --clobber

      - name: Generate & Attach Release manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          gh release view "$TAG" --json tagName,targetCommitish,publishedAt,assets > release_meta.json
          rm -rf release_assets && mkdir -p release_assets
          gh release download "$TAG" --dir release_assets --clobber
          python3 - <<'PY'
          import hashlib, json, os, re
          from datetime import datetime, timezone

          def sha256_file(path: str) -> str:
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          with open("package.json", "r", encoding="utf-8") as f:
              pkg = json.load(f)
          app_version = pkg["version"]

          with open("upsed-bridge/include/config.h", "r", encoding="utf-8") as f:
              cfg = f.read()
          m = re.search(r'#define\s+BRIDGE_FIRMWARE_VER\s+"([^"]+)"', cfg)
          if not m:
              raise RuntimeError("Could not find BRIDGE_FIRMWARE_VER in upsed-bridge/include/config.h")
          bridge_version = m.group(1)

          bin_path = "upsed-bridge-firmware.bin"
          bridge_size = os.path.getsize(bin_path)
          bridge_sha256 = sha256_file(bin_path)

          with open("release_meta.json", "r", encoding="utf-8") as f:
              rel = json.load(f)

          tag_name = rel.get("tagName", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "Sandakan/UPSED")

          app_assets = []
          for a in rel.get("assets", []):
              name = a["name"]
              if name in ("manifest.json", bin_path):
                  continue
              asset_file = os.path.join("release_assets", name)
              asset_sha256 = sha256_file(asset_file) if os.path.isfile(asset_file) else None
              app_assets.append({
                  "name": name,
                  "size": a["size"],
                  "sha256": asset_sha256,
              })

          manifest = {
              "schemaVersion": 1,
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "release": {
                  "tag": tag_name,
                  "commit": os.environ.get("GITHUB_SHA", rel.get("targetCommitish", "")),
                  "url": f"https://github.com/{repo}/releases/tag/{tag_name}" if tag_name else "",
              },
              "app": {
                  "version": app_version,
                  "assets": app_assets,
              },
              "bridge": {
                  "version": bridge_version,
                  "board": "esp32-s3-devkitc-1",
                  "asset": bin_path,
                  "size": bridge_size,
                  "sha256": bridge_sha256,
              },
          }

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          gh release upload "$TAG" manifest.json --clobber
