[package]
name = "voltwatch"
version = "0.1.0"
description = "A modern, secure, cross-platform Voltronic UPS manager"
authors = ["VoltWatch Contributors"]
edition = "2021"

[lib]
name = "voltwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.33", features = ["bundled"] }
hidapi = "2.6"
log = "0.4"
tauri-plugin-log = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
