[package]
name = "upsed"
version = "0.1.6"
description = "A modern, secure, cross-platform Voltronic UPS manager"
authors = ["UPSED Contributors"]
edition = "2021"

[lib]
name = "upsed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tauri-plugin-notification = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
rusqlite = { version = "0.33", features = ["bundled"] }
hidapi = "2.6"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tungstenite = "0.24"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
argon2 = { version = "0.5", features = ["std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
rfd = "0.17.2"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
